<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1426"/>
      <stop offset="100%" stop-color="#0F1D35"/>
    </linearGradient>
    <linearGradient id="frozen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F2A3F"/>
      <stop offset="100%" stop-color="#0A1F2F"/>
    </linearGradient>
    <linearGradient id="trained" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A1F0A"/>
      <stop offset="100%" stop-color="#1F140A"/>
    </linearGradient>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE"/>
    </marker>
    <marker id="arrOr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrGr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22C55E"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg2)"/>
  <rect x="0" y="0" width="12" height="1000" fill="#F59E0B"/>

  <text x="60" y="64" fill="#F8FAFC" font-size="42" font-weight="800">Hybrid Two-Layer Model</text>
  <text x="60" y="98" fill="#94A3B8" font-size="20">Pretrained backbone + self-trained classifier head · trained and updated online by us</text>

  <!-- ========== INPUT ========== -->
  <g>
    <rect x="60" y="180" width="220" height="260" rx="18" fill="#0F2A22" stroke="#22C55E" stroke-width="2"/>
    <text x="170" y="215" fill="#22C55E" font-size="18" font-weight="700" text-anchor="middle">USER PHOTO</text>
    <rect x="100" y="236" width="140" height="180" rx="10" fill="#0B1426" stroke="#22C55E" stroke-width="1.5"/>
    <ellipse cx="170" cy="310" rx="44" ry="54" fill="none" stroke="#22C55E" stroke-width="2.5"/>
    <circle cx="152" cy="300" r="4" fill="#22C55E"/>
    <circle cx="188" cy="300" r="4" fill="#22C55E"/>
    <path d="M 150 330 Q 170 345 190 330" stroke="#22C55E" stroke-width="2" fill="none"/>
    <text x="170" y="400" fill="#94A3B8" font-size="11" text-anchor="middle">RGB · aligned · detected</text>
  </g>

  <!-- arrow to backbone -->
  <path d="M 280 310 L 380 310" stroke="#22D3EE" stroke-width="3" marker-end="url(#arrBlue)"/>

  <!-- ========== BACKBONE (FROZEN) ========== -->
  <g>
    <rect x="380" y="170" width="480" height="290" rx="20" fill="url(#frozen)" stroke="#22D3EE" stroke-width="2.5"/>
    <text x="620" y="206" fill="#22D3EE" font-size="20" font-weight="800" text-anchor="middle">LAYER 1 — BACKBONE (FROZEN)</text>
    <rect x="780" y="184" width="70" height="26" rx="13" fill="#22D3EE"/>
    <text x="815" y="202" fill="#0B1426" font-size="12" text-anchor="middle" font-weight="700">FROZEN</text>

    <!-- ArcFace box -->
    <rect x="406" y="230" width="200" height="200" rx="14" fill="#0B1426" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="506" y="258" fill="#22D3EE" font-size="15" text-anchor="middle" font-weight="700">ArcFace</text>
    <text x="506" y="278" fill="#64748B" font-size="11" text-anchor="middle">pretrained (DeepFace)</text>
    <!-- mini neural net dots -->
    <g fill="#22D3EE">
      <circle cx="430" cy="310" r="4"/><circle cx="430" cy="340" r="4"/><circle cx="430" cy="370" r="4"/>
      <circle cx="470" cy="298" r="4"/><circle cx="470" cy="330" r="4"/><circle cx="470" cy="362" r="4"/><circle cx="470" cy="392" r="4"/>
      <circle cx="510" cy="310" r="4"/><circle cx="510" cy="340" r="4"/><circle cx="510" cy="370" r="4"/>
      <circle cx="550" cy="325" r="4"/><circle cx="550" cy="355" r="4"/>
      <circle cx="585" cy="340" r="4"/>
    </g>
    <g stroke="#1E3A5F" stroke-width="1">
      <line x1="430" y1="310" x2="470" y2="298"/><line x1="430" y1="310" x2="470" y2="330"/>
      <line x1="430" y1="340" x2="470" y2="330"/><line x1="430" y1="340" x2="470" y2="362"/>
      <line x1="430" y1="370" x2="470" y2="362"/><line x1="430" y1="370" x2="470" y2="392"/>
      <line x1="470" y1="298" x2="510" y2="310"/><line x1="470" y1="330" x2="510" y2="310"/>
      <line x1="470" y1="330" x2="510" y2="340"/><line x1="470" y1="362" x2="510" y2="340"/>
      <line x1="470" y1="362" x2="510" y2="370"/><line x1="470" y1="392" x2="510" y2="370"/>
      <line x1="510" y1="310" x2="550" y2="325"/><line x1="510" y1="340" x2="550" y2="325"/>
      <line x1="510" y1="340" x2="550" y2="355"/><line x1="510" y1="370" x2="550" y2="355"/>
      <line x1="550" y1="325" x2="585" y2="340"/><line x1="550" y1="355" x2="585" y2="340"/>
    </g>
    <text x="506" y="420" fill="#F8FAFC" font-size="12" text-anchor="middle">→ 512-d embedding</text>

    <!-- Facenet box -->
    <rect x="626" y="230" width="200" height="200" rx="14" fill="#0B1426" stroke="#22D3EE" stroke-width="1.5"/>
    <text x="726" y="258" fill="#22D3EE" font-size="15" text-anchor="middle" font-weight="700">Facenet512</text>
    <text x="726" y="278" fill="#64748B" font-size="11" text-anchor="middle">pretrained (DeepFace)</text>
    <g fill="#22D3EE">
      <circle cx="650" cy="310" r="4"/><circle cx="650" cy="340" r="4"/><circle cx="650" cy="370" r="4"/>
      <circle cx="690" cy="298" r="4"/><circle cx="690" cy="330" r="4"/><circle cx="690" cy="362" r="4"/><circle cx="690" cy="392" r="4"/>
      <circle cx="730" cy="310" r="4"/><circle cx="730" cy="340" r="4"/><circle cx="730" cy="370" r="4"/>
      <circle cx="770" cy="325" r="4"/><circle cx="770" cy="355" r="4"/>
      <circle cx="805" cy="340" r="4"/>
    </g>
    <g stroke="#1E3A5F" stroke-width="1">
      <line x1="650" y1="310" x2="690" y2="298"/><line x1="650" y1="310" x2="690" y2="330"/>
      <line x1="650" y1="340" x2="690" y2="330"/><line x1="650" y1="340" x2="690" y2="362"/>
      <line x1="650" y1="370" x2="690" y2="362"/><line x1="650" y1="370" x2="690" y2="392"/>
      <line x1="690" y1="298" x2="730" y2="310"/><line x1="690" y1="330" x2="730" y2="310"/>
      <line x1="690" y1="330" x2="730" y2="340"/><line x1="690" y1="362" x2="730" y2="340"/>
      <line x1="690" y1="362" x2="730" y2="370"/><line x1="690" y1="392" x2="730" y2="370"/>
      <line x1="730" y1="310" x2="770" y2="325"/><line x1="730" y1="340" x2="770" y2="325"/>
      <line x1="730" y1="340" x2="770" y2="355"/><line x1="730" y1="370" x2="770" y2="355"/>
      <line x1="770" y1="325" x2="805" y2="340"/><line x1="770" y1="355" x2="805" y2="340"/>
    </g>
    <text x="726" y="420" fill="#F8FAFC" font-size="12" text-anchor="middle">→ 512-d embedding</text>
  </g>

  <!-- concat arrow -->
  <path d="M 860 310 L 940 310" stroke="#22D3EE" stroke-width="3" marker-end="url(#arrBlue)"/>
  <text x="900" y="295" fill="#22D3EE" font-size="11" text-anchor="middle">concat</text>

  <!-- ========== HEAD (TRAINED) ========== -->
  <g>
    <rect x="940" y="170" width="600" height="290" rx="20" fill="url(#trained)" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="1240" y="206" fill="#F59E0B" font-size="20" font-weight="800" text-anchor="middle">LAYER 2 — HEAD (TRAINED BY US)</text>
    <rect x="1440" y="184" width="90" height="26" rx="13" fill="#F59E0B"/>
    <text x="1485" y="202" fill="#0B1426" font-size="12" text-anchor="middle" font-weight="700">WE TRAIN</text>

    <!-- Scaler -->
    <rect x="960" y="232" width="160" height="64" rx="10" fill="#0B1426" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="1040" y="258" fill="#F59E0B" font-size="13" text-anchor="middle" font-weight="700">StandardScaler</text>
    <text x="1040" y="280" fill="#94A3B8" font-size="11" text-anchor="middle">sklearn</text>

    <path d="M 1120 264 L 1180 264" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrOr)"/>

    <!-- SGD -->
    <rect x="1180" y="232" width="200" height="64" rx="10" fill="#0B1426" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="1280" y="258" fill="#F59E0B" font-size="13" text-anchor="middle" font-weight="700">SGDClassifier</text>
    <text x="1280" y="280" fill="#94A3B8" font-size="11" text-anchor="middle">loss=modified_huber</text>

    <path d="M 1380 264 L 1440 264" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrOr)"/>

    <!-- predict_proba -->
    <rect x="1440" y="232" width="90" height="64" rx="10" fill="#0B1426" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="1485" y="258" fill="#F59E0B" font-size="12" text-anchor="middle" font-weight="700">proba</text>
    <text x="1485" y="280" fill="#94A3B8" font-size="10" text-anchor="middle">(0 → 1)</text>

    <!-- training data bar -->
    <rect x="960" y="318" width="570" height="120" rx="12" fill="#0B1426" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="978" y="340" fill="#F59E0B" font-size="12" font-weight="700">TRAINING DATA</text>
    <circle cx="988" cy="366" r="6" fill="#22C55E"/>
    <text x="1004" y="371" fill="#F8FAFC" font-size="12">Positives: user's own enrolled embeddings (label = 1)</text>
    <circle cx="988" cy="392" r="6" fill="#EF4444"/>
    <text x="1004" y="397" fill="#F8FAFC" font-size="12">Negatives: synthetic — Gaussian noise σ=0.3 on positives, L2-renorm (label = 0)</text>
    <circle cx="988" cy="418" r="6" fill="#F59E0B"/>
    <text x="1004" y="423" fill="#F8FAFC" font-size="12">Accuracy reported by clf.score() on every train/partial_fit call</text>
  </g>

  <!-- ========== ENSEMBLE ========== -->
  <g>
    <rect x="380" y="510" width="1160" height="160" rx="20" fill="#0B1426" stroke="#22D3EE" stroke-width="2.5"/>
    <text x="960" y="548" fill="#22D3EE" font-size="20" font-weight="800" text-anchor="middle">ENSEMBLE FINAL SCORE</text>

    <g font-family="Consolas, Menlo, monospace">
      <text x="960" y="600" fill="#F8FAFC" font-size="30" text-anchor="middle">
        final_score = <tspan fill="#22D3EE" font-weight="700">0.5</tspan>·arc_dist + <tspan fill="#22D3EE" font-weight="700">0.3</tspan>·fnet_dist + <tspan fill="#F59E0B" font-weight="700">0.2</tspan>·(1 − clf_proba)
      </text>
    </g>

    <text x="960" y="640" fill="#94A3B8" font-size="15" text-anchor="middle">
      MATCH ⇔  final_score &lt; <tspan fill="#22C55E" font-weight="700">0.50</tspan>  (FINAL_THRESHOLD)
    </text>
  </g>

  <!-- arrow from backbone+head down to ensemble -->
  <path d="M 620 460 L 620 510" stroke="#22D3EE" stroke-width="3" marker-end="url(#arrBlue)"/>
  <path d="M 1240 460 L 1240 510" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrOr)"/>

  <!-- ========== ONLINE UPDATE LOOP ========== -->
  <g>
    <rect x="60" y="720" width="1480" height="220" rx="20" fill="#0F2A22" stroke="#22C55E" stroke-width="2.5"/>
    <text x="800" y="760" fill="#22C55E" font-size="20" font-weight="800" text-anchor="middle">ONLINE MODEL UPDATING LOOP</text>

    <!-- 4 steps -->
    <g font-size="14">
      <!-- Step 1 -->
      <circle cx="180" cy="850" r="34" fill="#0B1426" stroke="#22C55E" stroke-width="2.5"/>
      <text x="180" y="858" fill="#22C55E" font-size="24" font-weight="800" text-anchor="middle">1</text>
      <text x="180" y="905" fill="#F8FAFC" text-anchor="middle" font-weight="700">User signs in</text>
      <text x="180" y="925" fill="#94A3B8" font-size="12" text-anchor="middle">input + email label</text>

      <path d="M 218 850 L 338 850" stroke="#22C55E" stroke-width="2.5" marker-end="url(#arrGr)"/>

      <!-- Step 2 -->
      <circle cx="380" cy="850" r="34" fill="#0B1426" stroke="#22C55E" stroke-width="2.5"/>
      <text x="380" y="858" fill="#22C55E" font-size="24" font-weight="800" text-anchor="middle">2</text>
      <text x="380" y="905" fill="#F8FAFC" text-anchor="middle" font-weight="700">Pub/Sub event</text>
      <text x="380" y="925" fill="#94A3B8" font-size="12" text-anchor="middle">banking-ekyc-sign-in</text>

      <path d="M 418 850 L 538 850" stroke="#22C55E" stroke-width="2.5" marker-end="url(#arrGr)"/>

      <!-- Step 3 -->
      <circle cx="580" cy="850" r="34" fill="#0B1426" stroke="#22C55E" stroke-width="2.5"/>
      <text x="580" y="858" fill="#22C55E" font-size="24" font-weight="800" text-anchor="middle">3</text>
      <text x="580" y="905" fill="#F8FAFC" text-anchor="middle" font-weight="700">Extract embedding</text>
      <text x="580" y="925" fill="#94A3B8" font-size="12" text-anchor="middle">backbone forward pass</text>

      <path d="M 618 850 L 738 850" stroke="#22C55E" stroke-width="2.5" marker-end="url(#arrGr)"/>

      <!-- Step 4 -->
      <circle cx="780" cy="850" r="34" fill="#0B1426" stroke="#F59E0B" stroke-width="2.5"/>
      <text x="780" y="858" fill="#F59E0B" font-size="24" font-weight="800" text-anchor="middle">4</text>
      <text x="780" y="905" fill="#F8FAFC" text-anchor="middle" font-weight="700">partial_fit()</text>
      <text x="780" y="925" fill="#94A3B8" font-size="12" text-anchor="middle">incremental · no downtime</text>

      <!-- arrow back (loop) -->
      <path d="M 818 850 L 960 850" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrOr)"/>

      <!-- Step 5 -->
      <circle cx="1000" cy="850" r="34" fill="#0B1426" stroke="#F59E0B" stroke-width="2.5"/>
      <text x="1000" y="858" fill="#F59E0B" font-size="24" font-weight="800" text-anchor="middle">5</text>
      <text x="1000" y="905" fill="#F8FAFC" text-anchor="middle" font-weight="700">Weights updated</text>
      <text x="1000" y="925" fill="#94A3B8" font-size="12" text-anchor="middle">mutated in place</text>

      <path d="M 1038 850 L 1158 850" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrOr)"/>

      <!-- Step 6 -->
      <circle cx="1200" cy="850" r="34" fill="#0B1426" stroke="#F59E0B" stroke-width="2.5"/>
      <text x="1200" y="858" fill="#F59E0B" font-size="24" font-weight="800" text-anchor="middle">6</text>
      <text x="1200" y="905" fill="#F8FAFC" text-anchor="middle" font-weight="700">Next signin</text>
      <text x="1200" y="925" fill="#94A3B8" font-size="12" text-anchor="middle">better boundary</text>

      <!-- loop arrow back to step 1 -->
      <path d="M 1240 835 Q 1400 780 1400 820 Q 1400 870 1240 870" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrOr)"/>
      <text x="1420" y="830" fill="#F59E0B" font-size="12">repeat</text>
    </g>
  </g>
</svg>
